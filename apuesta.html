<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <script src="juego.js"></script>
    </head>
    <body>
        <h1 class="position-absolute start-50 translate-middle" id="titulo">Blackjack</h1>
        <div id="dineroDiv" class="position-fixed top-0 end-0 m-3">
            <div class="card text-bg-dark border-warning shadow">
                <div class="card-body">
                    <small class="text-warning text-uppercase etiqueta">Dinero</small>
                    <div class="fw-bold cantidad"><span id="dinero"></span> €</div>
                </div>
            </div>
        </div>
        <div id="botonVolver" class="container">
            <button type="button" id="volver" class="btn btn-danger btn-lg" onclick="window.location.href='pantalla_inicio.html'">Volver</button>
        </div>
        <div class="container d-flex justify-content-center align-items-center min-vh-100" id="apuesta">
            <div class="d-flex flex-column align-items-center gap-3">
                <div>
                    <label for="cantidad" class="form-label text-white" style="font-size: 20px;">Apuesta</label>
                    <input type="number" id="cantidad" class="form-control" step="100" value="0" required>
                    <div id="error" class="text-danger mt-2"></div>
                </div>

                <button type="button" class="btn btn-primary btn-lg" id="apostar">
                    Apostar
                </button>
            </div>
        </div>
    </body>
</html>
